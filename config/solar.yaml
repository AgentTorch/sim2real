simulation:
  steps: 12

environment:
  grid_price:
    type: float
    value: 0.42
  installation_cost:
    type: float
    value: 15000.0 
  maintenance_cost:
    type: float
    value: 200.0
  diffusion_radius:
    type: float
    value: 5.0 
  distance_epsilon:
    type: float
    value: 0.01
  current_month:
    type: int
    value: 1

agents:
  facility:
    count: 1565
    properties:
      id: int
      latitude: float
      longitude: float
      solar_production_kwh: array, 12, float
      energy_demand_kwh: array, 12, float

  household:
    count: 3435
    properties:
      id: int
      latitude: float
      longitude: float
      has_solar: boolean
      adoption_propensity: float
      annual_savings: float

substeps:
  - name: solar_diffusion_and_adoption
    agent: household

    observation:
      name: gather_solar_inputs
      func: GatherSolarAndHouseholdData
      observes:
        - environment/current_month
        - facility/latitude
        - facility/longitude
        - facility/solar_production_kwh
        - facility/energy_demand_kwh
        - household/latitude
        - household/longitude
        - household/has_solar
        - household/adoption_propensity
      produces:
        - facility_latitudes
        - facility_longitudes
        - facility_solar_productions
        - facility_energy_demands
        - household_latitudes
        - household_longitudes
        - household_has_solar
        - household_adoption_propensities

    action:
      name: diffuse_and_decide
      func: DiffuseSolarExcessAndDecide
      requires:
        - environment/grid_price
        - environment/installation_cost
        - environment/maintenance_cost
        - environment/diffusion_radius
        - environment/distance_epsilon
      decides:
        - annual_savings
        - adoption_decision

    transition:
      name: update_household_solar_state
      func: UpdateHouseholdSolarAdoption
      updates:
        - household/has_solar
        - household/annual_savings
